; ESP32 firmware for the FakeGlucoSense simulated CGM sensor (ADR-0015).
;
; Builds with PlatformIO: `pio run`. Flashes a plain ESP32 dev board: `pio run -t upload`.
; The firmware speaks the same Bluetooth SIG CGM Service profile as the sensor-app
; (docs/ble-protocol.md), so the companion app connects without changes.

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++14
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=0
